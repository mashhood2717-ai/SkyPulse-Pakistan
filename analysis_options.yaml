include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # avoid_print stays ON: print() is not stripped from release builds.
    # Use logDebug() from lib/utils/log.dart instead.
    # Some dynamic construction is necessary
    prefer_const_constructors: false

analyzer:
  errors:
    # Suppress deprecated_member_use for withOpacity (Flutter 3.18 migration)
    deprecated_member_use: ignore
    prefer_const_declarations: ignore
