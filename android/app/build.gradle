plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing material. Kept out of version control, so a fresh clone has
// no keystore.properties and must still be able to build and run debug.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Fail only when a release artifact is actually requested. There is
// deliberately no debug-key fallback: falling back produced a debug-signed AAB
// that looked like a release build on any machine without the keystore.
gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any { task ->
        task.project.path == ':app' &&
            task.name ==~ /(?i)(assemble|bundle|package).*Release/
    }
    if (buildingRelease && !hasReleaseKeystore) {
        // IllegalStateException rather than GradleException purely so IDEs that
        // lack the Gradle API on their Groovy classpath do not flag this line;
        // Gradle fails the build on either.
        throw new IllegalStateException(
            "android/keystore.properties is missing - cannot sign a release build. " +
            "Copy keystore.properties.template and fill in the signing details.")
    }
}

android {
    namespace "com.mashhood.skypulsepk"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.mashhood.skypulsepk"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Required for flutter_local_notifications
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
        release {
            // Only populated when the keystore is present; the task-graph check
            // above stops an unsigned release from getting as far as an upload.
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties.getProperty('key.alias', '')
                keyPassword keystoreProperties.getProperty('key.password', '')
                storeFile file(keystoreProperties.getProperty('store.file'))
                storePassword keystoreProperties.getProperty('store.password', '')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Use default debug signing
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Core library desugaring for Java 8+ API support
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Firebase and WorkManager are pulled in transitively, at matching
    // versions, by firebase_core / firebase_messaging / workmanager. Pinning
    // them here previously forced firebase-messaging back to 23.4.1, below what
    // the Flutter plugin needs, and dragged in four unused Play Core modules.
}