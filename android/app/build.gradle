plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.mashhood.skypulsepk"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.mashhood.skypulsepk"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Required for flutter_local_notifications
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
        release {
            // Load keystore properties from keystore.properties file
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            def keystoreProperties = new Properties()
            def useDebugKey = true
            
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                useDebugKey = false
            }
            
            if (!useDebugKey) {
                keyAlias keystoreProperties.getProperty('key.alias', '')
                keyPassword keystoreProperties.getProperty('key.password', '')
                storeFile keystoreProperties.getProperty('store.file') ? file(keystoreProperties.getProperty('store.file')) : null
                storePassword keystoreProperties.getProperty('store.password', '')
            } else {
                // Fallback to debug key for testing
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file('debug.keystore')
                storePassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // For production: configure signing with keystore.properties
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // Use default debug signing
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Core library desugaring for Java 8+ API support
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Google Play Core for split installs and deferred components
    implementation 'com.google.android.play:core:1.10.3'
    
    // Firebase BOM for version management
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    
    // Firebase libraries (versions managed by BOM)
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    
    // AndroidX for background work
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
}