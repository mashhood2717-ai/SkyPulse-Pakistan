name: skypulse_pakistan
description: 'SkyPulse Pakistan - Real-time weather forecasts, storm alerts, and METAR aviation data with precise location-based updates for all Pakistani cities. Get accurate weather predictions, hourly forecasts, and emergency notifications to stay prepared.'

publish_to: 'none'

version: 1.2.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Location services
  geolocator: ^10.1.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Storage for favorites
  shared_preferences: ^2.2.2
  
  # UI
  intl: ^0.18.1
  cupertino_icons: ^1.0.2

  # Firebase - Push Notifications
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1

  # Local notifications for background/terminated state
  flutter_local_notifications: ^17.2.1

  # Home screen widget + its background refresh
  home_widget: ^0.6.0
  workmanager: ^0.10.0

  # App version shown in Settings
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
